<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Guardian - Password Strength Checker</title>
    
    <style>
        /* --- GLOBAL RESETS & FONTS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0b2512 0%, #020c04 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- MAIN CARD LAYOUT --- */
        .card {
            text-align: center;
            padding: 2.5rem;
            border: 1px solid #10b981;
            border-radius: 12px;
            background-color: rgba(10, 25, 14, 0.85);
            box-shadow: 0 8px 32px 0 rgba(16, 185, 129, 0.15);
            backdrop-filter: blur(6px);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
            letter-spacing: 1px;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        p {
            color: #cbd5e1;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        /* --- INPUT FIELDS --- */
        input[type="password"] {
            width: 100%;
            background: rgba(2, 12, 4, 0.6);
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 0.75rem;
            color: #e2e8f0;
            font-size: 1.1rem;
            border-radius: 6px;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        input:focus {
            border-color: #39ff14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        /* --- STRENGTH METER BAR (CUSTOM DIVS FOR 100% SUCCESS) --- */
        .checker-container {
            text-align: left;
            margin-top: 1.5rem;
        }

        .meter-container {
            width: 100%;
            height: 12px;
            background: rgba(2, 12, 4, 0.8);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 4px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            transition: all 0.4s ease;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        /* --- STATUS LABELS --- */
        .status-text {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #cbd5e1;
            margin-top: 0.5rem;
        }

        .hint-text {
            font-size: 0.8rem;
            color: #cbd5e1;
            opacity: 0.6;
            margin-top: 0.5rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Key Guardian</h2>
        <p>Password Strength Checker</p>
        
        <div class="checker-container">
            <input type="password" id="password" placeholder="Type your password...">
            
            <!-- Custom HTML progress bar -->
            <div class="meter-container">
                <div id="meter-fill" class="meter-bar"></div>
            </div>
            
            <div id="strength-text" class="status-text">Too weak ❌</div>
            <div id="hint-text" class="hint-text">Tip: Use 8+ characters with mixed letters, numbers, and symbols.</div>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const meterFill = document.getElementById('meter-fill');
        const strengthText = document.getElementById('strength-text');

        // Sabhi badhte hue scores ke liye designs aur texts
        const levels = [
            { width: '0%',  color: 'transparent', text: 'Too weak ❌' },
            { width: '25%', color: '#ef4444', text: 'Weak ⚠️' },
            { width: '50%', color: '#f59e0b', text: 'Fair 🟡' },
            { width: '75%', color: '#eab308', text: 'Good 🟢' },
            { width: '100%', color: '#39ff14', text: 'Strong 💪' }
        ];

        // Commonly guessed weak patterns directly blocked inside script
        const commonWeakPasswords = ['password', 'password123', 'p@ssword123', '12345678', 'qwertyuiop', 'admin123'];

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let score = 0;

            if (val.length === 0) {
                meterFill.style.width = levels[0].width;
                strengthText.innerText = levels[0].text;
                return;
            }

            // Rule 1: Length check (Kam se kam 8 letters)
            if (val.length >= 8) score++;
            // Rule 2: Upper and Lower case letters mixture
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
            // Rule 3: Numbers included
            if (/\d/.test(val)) score++;
            // Rule 4: Special Characters symbols included (!@#$ etc.)
            if (/[^A-Za-z0-9]/.test(val)) score++;

            // SECURITY FIX: Agar password upar diye gaye common list me match ho gaya toh forcefully zero score milega
            if (commonWeakPasswords.includes(val.toLowerCase())) {
                score = 1; // Direct failure down to weak state
            }

            // UI parameters real-time update
            const currentLevel = levels[score];
            meterFill.style.width = currentLevel.width;
            meterFill.style.backgroundColor = currentLevel.color;
            meterFill.style.boxShadow = `0 0 12px ${currentLevel.color}`;
            strengthText.innerText = currentLevel.text;
        });
    </script>
</body>
</html>
