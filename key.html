<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Guardian - Password Strength Checker</title>
    <!-- Linking your custom CSS stylesheet -->
    <link rel="stylesheet" href="keystyle.css">
</head>
<body>

    <div class="card">
        <h2>Key Guardian</h2>
        <p>Password Strength Checker</p>
        
        <div class="checker-container">
            <input type="password" id="password" placeholder="Type your password...">
            
            <!-- Custom HTML progress bar -->
            <div class="meter-container">
                <div id="meter-fill" class="meter-bar"></div>
            </div>
            
            <div id="strength-text" class="status-text">Too weak ❌</div>
            <div id="hint-text" class="hint-text">Tip: Use 8+ characters with mixed letters, numbers, and symbols.</div>
            
            <!-- Dynamic Copy Button -->
            <button id="copy-btn" class="copy-btn">Copy Password</button>
        </div>
    </div>

    <!-- Linking your custom Javascript logic file -->
    <script src="keyscript.js"></script>
</body>
</html>
