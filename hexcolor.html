<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI-Grid - Color Picker Pro</title>
    <!-- Links to your main global styles and new specialized picker style sheet -->
    <link rel="stylesheet" href="allstyle.css">
    <link rel="stylesheet" href="hexcolorstyle.css">
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
    <div class="container">
        <!-- Site Branding Header -->
        <header class="site-header">
            <div class="logo-container">
                <img src="favicon.png" alt="PI-Grid Logo" class="site-logo" />
                <span class="site-title">PI-Grid</span>
            </div>
        </header>

        <main>
            <h1>Color Picker</h1>
            <p class="welcome-text">Drag over the panel to extract design formats</p>

            <!-- Google Style Engine Block -->
            <div class="picker-engine">
                <!-- Color Field Canvas Box -->
                <div class="sv-box" id="svBox" style="background-color: rgb(255, 0, 0);">
                    <div class="sv-pointer" id="svPointer"></div>
                </div>

                <!-- Hue Track Slider -->
                <div class="slider-row">
                    <input type="range" id="hueSlider" min="0" max="360" value="111" class="picker-slider">
                </div>

                <!-- Transparency Slider -->
                <div class="slider-row">
                    <input type="range" id="alphaSlider" min="0" max="100" value="100" class="picker-slider">
                </div>
            </div>

            <!-- Dynamic Live Color Sample Preview Strip -->
            <div class="preview-strip" id="previewStrip" style="background-color: rgba(57, 255, 20, 1);"></div>

            <!-- Multi-Format Copy Mechanism Block -->
            <div class="output-group">
                <label class="output-label">Generated Color Output</label>
                <div class="output-box">
                    <input type="text" id="finalColorOutput" readonly value="#39FF14">
                    <button class="copy-btn" id="masterCopyBtn" onclick="copyActiveFormat()">
                        <span class="btn-icon">📋</span> COPY CODE
                    </button>
                </div>
            </div>

            <!-- Selector Tabs for Switching Formats -->
            <div class="format-switcher-row">
                <button class="format-tab active" onclick="switchFormat('hex', this)">HEX</button>
                <button class="format-tab" onclick="switchFormat('rgb', this)">RGB</button>
                <button class="format-tab" onclick="switchFormat('hsl', this)">HSL</button>
            </div>

            <a href="index.html" class="back-home">⬅ Back to Home</a>
        </main>
    </div>

    <script>
        const svBox = document.getElementById('svBox');
        const svPointer = document.getElementById('svPointer');
        const hueSlider = document.getElementById('hueSlider');
        const alphaSlider = document.getElementById('alphaSlider');
        const previewStrip = document.getElementById('previewStrip');
        const finalColorOutput = document.getElementById('finalColorOutput');

        let currentHue = 111; 
        let currentSat = 100;
        let currentValue = 54;
        let currentAlpha = 1;
        let isDragging = false;

        let activeFormat = 'hex'; 
        let colorDataStorage = {
            hex: '#39FF14',
            rgb: 'rgb(57, 255, 20)',
            hsl: 'hsl(111, 100%, 54%)'
        };

        // Initialize setup elements 
        updateColors();

        // Mouse & Touch Tracking System For Canvas Movements
        function handleColorMove(e) {
            const rect = svBox.getBoundingClientRect();
            let x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            let y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

            x = Math.max(0, Math.min(x, rect.width));
            y = Math.max(0, Math.min(y, rect.height));

            svPointer.style.left = x + 'px';
            svPointer.style.top = y + 'px';

            currentSat = Math.round((x / rect.width) * 100);
            currentValue = Math.round((1 - (y / rect.height)) * 100);

            updateColors();
        }

        svBox.addEventListener('mousedown', (e) => { isDragging = true; handleColorMove(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging) handleColorMove(e); });
        window.addEventListener('mouseup', () => isDragging = false);

        svBox.addEventListener('touchstart', (e) => { isDragging = true; handleColorMove(e); }, { passive: true });
        window.addEventListener('touchmove', (e) => { if (isDragging) handleColorMove(e); }, { passive: true });
        window.addEventListener('touchend', () => isDragging = false);

        hueSlider.addEventListener('input', (e) => {
            currentHue = e.target.value;
            svBox.style.backgroundColor = `hsl(${currentHue}, 100%, 50%)`;
            updateColors();
        });

        alphaSlider.addEventListener('input', (e) => {
            currentAlpha = e.target.value / 100;
            updateColors();
        });

        function updateColors() {
            let l = (2 - currentSat / 100) * currentValue / 2;
            let s = currentSat * currentValue / (l < 50 ? (l * 2) : (200 - l * 2));
            if (isNaN(s)) s = 0;

            const hslStr = currentAlpha === 1 ? 
                `hsl(${currentHue}, ${Math.round(s)}%, ${Math.round(l)}%)` : 
                `hsla(${currentHue}, ${Math.round(s)}%, ${Math.round(l)}%, ${currentAlpha})`;
            
            colorDataStorage.hsl = hslStr;

            const dummy = document.createElement('div');
            dummy.style.color = `hsl(${currentHue}, ${Math.round(s)}%, ${Math.round(l)}%)`;
            document.body.appendChild(dummy);
            const computedRgb = window.getComputedStyle(dummy).color;
            document.body.removeChild(dummy);

            const match = computedRgb.match(/\d+/g);
            if(match) {
                const r = parseInt(match[0]), g = parseInt(match[1]), b = parseInt(match[2]);
                
                colorDataStorage.rgb = currentAlpha === 1 ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${currentAlpha})`;
                
                let hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
                if(currentAlpha < 1) {
                    let aHex = Math.round(currentAlpha * 255).toString(16).toUpperCase().padStart(2, '0');
                    hex += aHex;
                }
                colorDataStorage.hex = hex;
                
                finalColorOutput.value = colorDataStorage[activeFormat];
                previewStrip.style.backgroundColor = colorDataStorage.rgb;
            }
        }

        function switchFormat(type, element) {
            activeFormat = type;
            document.querySelectorAll('.format-tab').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            finalColorOutput.value = colorDataStorage[activeFormat];
        }

        function copyActiveFormat() {
            finalColorOutput.select();
            navigator.clipboard.writeText(finalColorOutput.value);
            
            const btn = document.getElementById('masterCopyBtn');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = '<span class="btn-icon">✔</span> COPIED!';
            btn.style.borderColor = "#39ff14";
            btn.style.boxShadow = "0 0 15px rgba(57, 255, 20, 0.6)";
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.style.borderColor = "#10b981";
                btn.style.boxShadow = "";
            }, 1200);
        }
    </script>
</body>
</html>
