<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secret Access Granted</title>
  <link rel="stylesheet" href="secretstyle.css" />
  <script>
    // Security check: Verify if the access token exists in session storage
    if (sessionStorage.getItem("secretAccess") !== "granted") {
      // If token is missing, bounce back to the calculator
      window.location.replace("calculator.html");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const errorMessage = document.getElementById("error-message");
      const backLinkContainer = document.getElementById("back-link-container");

      setTimeout(() => {
        errorMessage.textContent = "If you aren't redirected yet then you are not the authorised one. . . ";
        errorMessage.style.display = "block";
      }, 5000);

      setTimeout(() => {
        backLinkContainer.style.display = "block";
      }, 7000); 
    });
  </script>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>Welcome to the secret access</h1>
    </header>
    
    <main>
      <p>You are granted secret access</p>
    </main>

    <footer>
      <!-- Container to hold the unchanged text and the loading spinner together -->
      <div class="loading-container">
        <p id="footer-text">Redirecting . . .</p>
        <div class="spinner"></div>
      </div>
      
      <!-- Hidden elements appearing step-by-step below -->
      <p id="error-message" class="error-text" style="display: none;"></p>
      
      <div id="back-link-container" style="display: none; margin-top: 15px;">
        <a href="https://pi-grid.github.io/calculator.html" class="back-link">Go back to the calculator</a>
      </div>
    </footer>
  </div>
</body>
</html>
