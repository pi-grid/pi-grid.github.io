<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi-Grid Ai</title>
    <style>
        /* --- 1. GLOBAL RESETS & FONTS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0b2512 0%, #020c04 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- 2. GLOBAL CONTAINER CARD --- */
        .ai-chat-container {
            text-align: center;
            padding: 2rem;
            border: 1px solid #10b981;
            border-radius: 12px;
            background-color: rgba(10, 25, 14, 0.85);
            box-shadow: 0 8px 32px 0 rgba(16, 185, 129, 0.15);
            backdrop-filter: blur(6px);
            width: 100%;
            max-width: 480px;
        }

        /* --- 3. HEADINGS & TEXT --- */
        h3 {
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        /* --- 4. BUTTONS --- */
        button {
            background: rgba(16, 185, 129, 0.1);
            color: #39ff14;
            border: 1px solid #10b981;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
        }

        button:hover {
            background: #10b981;
            color: #020c04;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
            transform: translateY(-2px);
        }

        button:disabled {
            background: rgba(16, 185, 129, 0.05);
            color: rgba(57, 255, 20, 0.3);
            border-color: rgba(16, 185, 129, 0.2);
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* --- 5. INPUT FIELDS & SELECT --- */
        input[type="text"], input[type="password"], select {
            width: 100%;
            background: rgba(2, 12, 4, 0.6);
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 0.75rem;
            color: #e2e8f0;
            font-size: 1rem;
            border-radius: 6px;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        input:focus, select:focus {
            border-color: #39ff14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        /* --- 6. CHAT SPECIFIC LAYOUT --- */
        .chat-box {
            height: 280px;
            overflow-y: auto;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 1rem;
            background: rgba(2, 12, 4, 0.8);
            text-align: left;
        }

        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: #10b981; border-radius: 3px; }

        .status {
            font-size: 0.8rem;
            color: #39ff14;
            opacity: 0.8;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chat-msg { margin-bottom: 12px; font-size: 0.95rem; line-height: 1.4; }
        .chat-msg strong { color: #39ff14; text-transform: uppercase; }
        
        /* For generated media files */
        .generated-media {
            max-width: 100%;
            border-radius: 6px;
            border: 1px solid #10b981;
            margin-top: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="ai-chat-container">
        <h3>Pi-Grid AI</h3>
        <div id="status" class="status">Initializing Neural Grid...</div>
        <div id="chatBox" class="chat-box"></div>
        
        <!-- Task Selection -->
        <select id="generationMode">
            <option value="text">Search / Text Generation (Free)</option>
            <option value="image">Image Generation (Requires Key)</option>
            <option value="video">Video Generation (Requires Key)</option>
        </select>

        <!-- Secret Key Field (Hidden by default, shown for image/video) -->
        <input type="password" id="secretKey" placeholder="Enter Secret OwnerKey" style="display: none;" />

        <!-- User Prompt -->
        <input type="text" id="userInput" placeholder="Input prompt/command..." disabled />
        <button id="sendBtn" disabled>Execute</button>
    </div>

    <!-- Linking external JS file as module -->
    <script type="module" src="aiscript.js"></script>
</body>
</html>
