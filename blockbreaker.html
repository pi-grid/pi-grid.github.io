<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Breaker</title>
    <!-- CSS file link ki gayi hai -->
    <link rel="stylesheet" href="blockbreakerstyle.css">
</head>
<body>

    <div class="ui-panel">
        <div>Score: <span id="score-text">0</span></div>
        <div>Wave: <span id="wave-text">1</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
        
        <!-- Pause / Message Overlay -->
        <div id="menu-overlay" class="overlay">
            <h2 id="overlay-title">PAUSED</h2>
            <button id="okay-btn">OKAY / RESUME</button>
        </div>
    </div>

    <div class="controls">
        <button id="pause-btn">PAUSE</button>
        <button id="reset-btn">RESET</button>
    </div>

    <!-- JavaScript file link ki gayi hai -->
    <script src="blockbreakerscript.js"></script>
</body>
</html>
