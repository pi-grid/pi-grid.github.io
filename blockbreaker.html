<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI-Grid Block Breaker</title>
    <link rel="stylesheet" href="blockbreakerstyle.css">
</head>
<body>

    <div class="container">
        <h1>BLOCK BREAKER</h1>
        
        <div class="ui-panel">
            <div>SCORE: <span id="score-text">0</span></div>
            <div>WAVE: <span id="wave-text">1</span></div>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas" width="370" height="320"></canvas>
            
            <div id="menu-overlay" class="overlay">
                <h2 id="overlay-title">PAUSED</h2>
                <button id="okay-btn">RESUME</button>
            </div>
        </div>

        <div class="controls">
            <!-- Shuruati state me text explicitly manual set hai -->
            <button id="pause-btn">START</button>
            <button id="reset-btn">RESET</button>
        </div>
    </div>

    <script src="blockbreakerscript.js"></script>
</body>
</html>
