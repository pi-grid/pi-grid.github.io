<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI-Grid Timer</title>
    <!-- Linking external CSS layout -->
    <link rel="stylesheet" href="timerstyle.css">
</head>
<body>

    <div id="timer-card" class="card">
        <h2>Timer</h2>
        <p>Countdown Starts In…</p>
        
        <!-- Typing Input Area with custom limits and infinite days -->
        <div class="input-grid" id="input-fields-container">
            <div class="input-box">
                <label>Days</label>
                <input type="number" id="input-days" placeholder="00" min="0" max="9999999999999" oninput="validateAndJumpDays(this, 'input-hours')">
            </div>
            <div class="input-box">
                <label>Hours</label>
                <input type="number" id="input-hours" placeholder="00" min="0" max="23" oninput="validateAndJumpHours(this, 'input-minutes')">
            </div>
            <div class="input-box">
                <label>Minutes</label>
                <input type="number" id="input-minutes" placeholder="00" min="0" max="59" oninput="validateAndJumpMinutes(this, 'input-seconds')">
            </div>
            <div class="input-box">
                <label>Seconds</label>
                <input type="number" id="input-seconds" placeholder="00" min="0" max="59" oninput="validateSeconds(this)">
            </div>
        </div>

        <!-- Dynamic Numeric Readout Interface (DD:HH:MM:SS format) -->
        <div id="timer-display" class="timer-display">00:00:00:00</div>
        
        <!-- Action Control Interface buttons -->
        <div class="controls-container">
            <button id="start-btn" class="btn" onclick="toggleTimer()">Start</button>
            <button class="btn btn-reset" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <!-- Linking external script execution -->
    <script src="timerscript.js"></script>
</body>
</html>
